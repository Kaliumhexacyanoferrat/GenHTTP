name: ioxide Protocol Analysis

# Analysis branch only (not to be merged): runs the acceptance tests on the ioxide engine
# once per protocol and summarizes how many of them pass.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  test:

    name: ioxide ${{ matrix.protocol }}

    runs-on: ubuntu-latest

    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        protocol: [ H1, H2, H3 ]

    env:
      DOTNET_ROLL_FORWARD: Major
      TEST_ENGINE: Ioxide
      TEST_PROTOCOL: ${{ matrix.protocol }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Download .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Enable io_uring
      run: |
        sudo sysctl -w kernel.io_uring_disabled=0 2>/dev/null || true
        sudo modprobe tls 2>/dev/null || true

    - name: Install libmsquic (HTTP/3 support)
      run: |
        sudo apt-get update
        sudo apt-get install -y libmsquic

    - name: Build tests
      run: dotnet build Testing/Acceptance/GenHTTP.Testing.Acceptance.csproj -c Release -f net10.0

    # Kestrel tests would be forced onto ioxide, the ioxide tests bind their own protocols
    # and the adapter tests run on ASP.NET - none of them say anything about the protocol.
    - name: Run tests on ioxide (${{ matrix.protocol }})
      timeout-minutes: 90
      run: |
        sudo prlimit --pid $$ --memlock=-1:-1 2>/dev/null || ulimit -l unlimited 2>/dev/null || true
        dotnet test Testing/Acceptance/GenHTTP.Testing.Acceptance.csproj -c Release -f net10.0 --no-build \
          --filter "FullyQualifiedName!~GenHTTP.Testing.Acceptance.Engine.Kestrel&FullyQualifiedName!~GenHTTP.Testing.Acceptance.Engine.Ioxide&FullyQualifiedName!~GenHTTP.Testing.Acceptance.Adapters" \
          --logger "trx;LogFileName=results-${{ matrix.protocol }}.trx" --results-directory results \
          -- MSTest.TestTimeout=60000 || true

    - name: Summarize
      if: always()
      run: |
        python3 .github/scripts/protocol_summary.py ${{ matrix.protocol }} results/results-${{ matrix.protocol }}.trx \
          results/summary-${{ matrix.protocol }}.md results/failures-${{ matrix.protocol }}.json
        cat results/summary-${{ matrix.protocol }}.md >> $GITHUB_STEP_SUMMARY

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ matrix.protocol }}
        path: results/
